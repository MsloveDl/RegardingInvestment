<h1 id="_1">秋凉</h1>
<blockquote>
<p>URL: https://xueqiu.com/4327270746/113644303</p>
</blockquote>
<p>来源：雪球App，作者： 为霜，（https://xueqiu.com/4327270746/113644303）
一觉醒来，阳光和煦的照进了房子里。一股淡淡的温暖如涟漪，淡淡的在心里泛开。
记得以前我思念的是那么的春雨绵绵的日子。仿佛如情人的发丝，在心头萦绕。却不知何时起，喜欢上了秋凉。
少年不识愁滋味，为赋新词强说愁。如今识尽愁滋味，却道天凉好个秋
人生总是这样。日子就是这样不咸不淡的过着。</p>
